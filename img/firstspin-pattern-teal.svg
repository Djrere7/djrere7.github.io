<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="First Spin DJ Bootcamp element pattern — vinyl records, headphones, palms and music notes on teal.">
  <defs>
    <!-- Reusable vinyl record -->
    <g id="p-vinyl">
      <circle r="70" fill="#093233"/>
      <circle r="52" fill="none" stroke="#1fbcc2" stroke-width="2.4" opacity=".55"/>
      <circle r="41" fill="none" stroke="#1fbcc2" stroke-width="2.4" opacity=".45"/>
      <circle r="30" fill="none" stroke="#1fbcc2" stroke-width="2.4" opacity=".35"/>
      <circle r="18" fill="#f4772e"/>
      <circle r="4" fill="#093233"/>
    </g>
    <!-- Headphones -->
    <g id="p-phones">
      <path d="M-52 22 V4 a52 52 0 0 1 104 0 V22" fill="none" stroke="#093233" stroke-width="13" stroke-linecap="round"/>
      <rect x="-64" y="16" width="26" height="44" rx="13" fill="#093233"/>
      <rect x="38" y="16" width="26" height="44" rx="13" fill="#093233"/>
      <ellipse cx="-51" cy="38" rx="7" ry="13" fill="#f4772e"/>
      <ellipse cx="51" cy="38" rx="7" ry="13" fill="#f4772e"/>
    </g>
    <!-- Palm tree -->
    <g id="p-palm">
      <g fill="none" stroke="#093233" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 90 C-6 58 -6 36 4 14"/>
        <path d="M4 14 C-16 4 -40 6 -60 20"/>
        <path d="M4 14 C24 4 48 6 68 20"/>
        <path d="M4 14 C-12 -6 -30 -18 -50 -22"/>
        <path d="M4 14 C20 -6 38 -18 58 -22"/>
        <path d="M4 14 C4 -8 4 -26 4 -44"/>
      </g>
    </g>
    <!-- Music note -->
    <g id="p-note">
      <path d="M-6 -34 L34 -44 V16" fill="none" stroke="#093233" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-14" cy="18" r="15" fill="#093233"/>
      <circle cx="34" cy="16" r="15" fill="#093233"/>
    </g>
    <g id="p-note-o">
      <path d="M-6 -34 L34 -44 V16" fill="none" stroke="#f4772e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-14" cy="18" r="15" fill="#f4772e"/>
      <circle cx="34" cy="16" r="15" fill="#f4772e"/>
    </g>
    <!-- Swirl -->
    <g id="p-swirl">
      <path d="M0 0 C26 -4 30 24 8 26 C-8 27 -8 8 4 10" fill="none" stroke="#0c7f84" stroke-width="6" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Teal ground -->
  <rect width="600" height="600" fill="#18b3b9"/>

  <!-- Faint water-wave texture (kept inside bounds so the tile repeats cleanly) -->
  <g fill="none" stroke="#0fa1a7" stroke-width="7" stroke-linecap="round" opacity=".5">
    <path d="M70 300 q55 -34 110 0 t110 0 t110 0"/>
    <path d="M120 360 q55 -30 110 0 t110 0"/>
    <path d="M80 250 q45 -26 90 0 t90 0"/>
  </g>

  <!-- Elements (bounding boxes kept off the tile edges for seamless repeat) -->
  <use href="#p-phones" transform="translate(150 140) scale(1.05)"/>
  <use href="#p-vinyl"  transform="translate(455 150) scale(1.02)"/>
  <use href="#p-palm"   transform="translate(120 470) scale(1.5)"/>
  <use href="#p-vinyl"  transform="translate(470 460) scale(0.92)"/>
  <use href="#p-note-o" transform="translate(300 300) scale(0.85)"/>
  <use href="#p-note"   transform="translate(250 240) scale(0.7) rotate(-8)"/>
  <use href="#p-note-o" transform="translate(360 430) scale(0.6) rotate(10)"/>
  <use href="#p-swirl"  transform="translate(300 150) scale(1.4)"/>
  <use href="#p-swirl"  transform="translate(210 350) scale(1.1) rotate(20)"/>
</svg>
